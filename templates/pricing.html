{% extends "base.html" %}

{% block title %}Pricing - DeviceTracker{% endblock %}

{% block content %}
<div class="container my-5 text-center">
  <h1 class="mb-4">Pricing</h1>

  <div class="table-responsive mt-4">
    <table class="table table-dark">
      <thead>
        <tr>
          <th>Plan</th>
          <th>Price</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>Free</td>
          <td>$0 — just try it out</td>
        </tr>
        <tr>
          <td>Basic</td>
          <td>$2 / month — for light use</td>
        </tr>
        <tr>
          <td>Pro</td>
          <td>$5 / month — for serious tracking</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
{% endblock %}
