<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Device Live Map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      background: #111;
      color: #eee;
      font-family: Arial, sans-serif;
    }
    header {
      padding: 10px;
      background: #222;
      text-align: center;
      font-size: 20px;
      font-weight: bold;
    }
    #map {
      flex: 1;
      width: 100%;
    }
  </style>
</head>
<body data-serial="{{ device.serial_number if device else '' }}">
  <header>
    Live Device Tracking
  </header>
  <div id="map"></div>

  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script>
    // Initialize the map
    var map = L.map("map", { center: [0,0], zoom: 2, maxZoom: 22 });

    // Tile layers
    var osm = L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19,
      attribution: "© OpenStreetMap"
    });
    var esri = L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}", {
      maxZoom: 22,
      attribution: "Tiles © Esri"
    });

    esri.addTo(map);
    L.control.layers({ "OpenStreetMap": osm, "Esri Satellite": esri }).addTo(map);

    // Marker placeholder (invisible until we have coords)
    var marker = L.marker([0,0], { opacity: 0 }).addTo(map);

    // Get serial number from body attribute
    const serial = document.body.dataset.serial;

    // Function to update position
    function updatePosition(d, zoomOnFirst=true) {
      if (!d || d.error || d.latitude == null || d.longitude == null) return;
      const lat = d.latitude, lng = d.longitude;

      marker.setLatLng([lat, lng]).setOpacity(1)
        .bindPopup(`Serial: ${serial}<br>Last seen: ${d.last_seen || 'n/a'}`);

      if (zoomOnFirst) {
        map.setView([lat, lng], 20); // Zoom close initially
      } else {
        const currentZoom = map.getZoom();
        if (currentZoom >= 19) {
          map.panTo([lat, lng], { animate: true, duration: 0.5 });
        } else {
          map.setView([lat, lng], 20);
        }
      }
    }

    // Initial fetch
    if (serial) {
      fetch(`/api/device_location/${encodeURIComponent(serial)}`)
        .then(r => r.json())
        .then(d => updatePosition(d, true))
        .catch(console.error);

      // Poll every 3s
      setInterval(() => {
        fetch(`/api/device_location/${encodeURIComponent(serial)}`)
          .then(r => r.json())
          .then(d => updatePosition(d, false))
          .catch(console.error);
      }, 3000);
    }
  </script>
</body>
</html>
